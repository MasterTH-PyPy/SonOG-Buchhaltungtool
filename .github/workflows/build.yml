name: Build und Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build SonOG.Buchhaltung.sln -c Release
      - name: Tests
        run: dotnet test tests/SonOG.Buchhaltung.Tests -c Release --no-build --verbosity normal
